[platformio]
default_envs = uno

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 9600
upload_port = COM7

; Biblioteca do servo motor (nao vem no framework AVR)
lib_deps =
    arduino-libraries/Servo@^1.2.1

; O resto (digitalWrite, pulseIn) ja vem no framework Arduino.